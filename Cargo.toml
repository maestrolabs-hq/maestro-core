[workspace]
resolver = "3"
members = [
    "crates/wire",
    "crates/ledger",
    "crates/policy",
    "crates/sink",
    "crates/supervisor",
    "crates/cli",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
maestro-wire = { path = "crates/wire" }
maestro-ledger = { path = "crates/ledger" }
maestro-policy = { path = "crates/policy" }
maestro-sink = { path = "crates/sink" }
maestro-supervisor = { path = "crates/supervisor" }

# The workspace. Two crates, and the split is load-bearing.
#
# `protocol` is the envelope shape: what one agent hands another, with no
# knowledge of transport, storage or who receives it. `cli` is the only thing
# that talks to a terminal.
#
# Four other crates existed here and were deleted, because a seam is only real
# when something varies across it and none of them held a line of code. The
# designs survive in docs/ as designs.

[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
maestro-protocol = { path = "crates/protocol" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
cognitive_complexity = "warn"
# Governance uses 5; clippy defaults to 7.
too_many_arguments = "warn"
